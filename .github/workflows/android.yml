# Compila el APK de Android en GitHub cada vez que cambia la app
# y lo publica en Releases: https://github.com/Andresaurio5/Micigoto/releases/latest/download/Micigoto.apk
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk Micigoto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Micigoto-apk
          path: Micigoto.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Micigoto v1.0.${{ github.run_number }}
          body: |
            APK de Micigoto para Android. Descárgalo e instálalo (permite "orígenes desconocidos" si te lo pide).
          files: Micigoto.apk
          make_latest: true
